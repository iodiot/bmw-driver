<script type="module">
import * as THREE from 'three';import {setupEnvironment} from './environment-v12.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#10141b');const extent=3.3;const orthoCamera=new THREE.OrthographicCamera(-extent*innerWidth/innerHeight,extent*innerWidth/innerHeight,extent,-extent,.01,600);const perspectiveCamera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.01,600);let camera=perspectiveCamera;camera.position.set(6,2.7,6);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;document.body.appendChild(renderer.domElement);const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(new RoomEnvironment(),.03).texture;scene.add(new THREE.HemisphereLight(0xdceeff,0x243246,1.0));const key=new THREE.DirectionalLight(0xffffff,2.4);key.position.set(4,6,2);scene.add(key);const fill=new THREE.DirectionalLight(0xa0caff,1);fill.position.set(-2,2,-4);scene.add(fill);
setupEnvironment(scene,renderer,key);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(-.15,.75,0);controls.enableDamping=true;controls.autoRotateSpeed=.5;controls.minZoom=.5;controls.maxZoom=6;
const $=s=>document.querySelector(s);let hoodRoot,opening=0,leds=[],wheelPivots=[],steeringPivots=[],steering=0,rpm=30,spinning=true;
new GLTFLoader().load('./bmw-aluminum-v13.glb',g=>{scene.add(g.scene);g.scene.traverse(o=>{if(o.name==='Hood_pivot')hoodRoot=o;if(o.name.startsWith('Wheel_spin_'))wheelPivots.push(o);if(o.name.startsWith('Steering_'))steeringPivots.push(o);if(o.isMesh){o.castShadow=!o.material.transparent;o.receiveShadow=false;if(o.material.transparent)o.material.depthWrite=false;if(o.material.name==='LED rings'){leds.push(o.material);o.material.emissiveIntensity=1.6}}});$('#status').textContent='Ready';document.body.dataset.loaded='true';document.body.dataset.wheels=wheelPivots.length;},undefined,e=>{$('#status').hidden=false;$('#status').textContent='Unable to load: '+e.message});
$('#hood').oninput=e=>{const degrees=Number(e.target.value);opening=degrees*Math.PI/180;camera.zoom=1-degrees/200;camera.updateProjectionMatrix();controls.target.y=.75+degrees/100;$('#angle').textContent=degrees+'°'};$('#lights').onchange=e=>leds.forEach(m=>m.emissiveIntensity=e.target.checked?1.6:0);$('#orbit').onchange=e=>controls.autoRotate=e.target.checked;$('#steer').oninput=e=>{steering=Number(e.target.value)*Math.PI/180;$('#steer-angle').textContent=e.target.value+'°'};$('#speed').oninput=e=>{rpm=Number(e.target.value);$('#rpm').textContent=rpm+' RPM'};$('#spin').onchange=e=>spinning=e.target.checked;
function view(pos,target=[-.15,.75,0],zoom=1){camera.zoom=zoom;camera.position.set(...pos);camera.up.set(0,1,0);camera.updateProjectionMatrix();controls.target.set(...target);controls.update()}
$('#rear').onclick=()=>view([-7,1.1,0]);
$('#front').onclick=()=>view([7,.9,0]);$('#side').onclick=()=>view([-.15,1.1,8]);$('#three').onclick=()=>view([6,2.7,6]);$('#wheel').onclick=()=>view([2.4,.8,3.5],[1.46,.40,.82],4.1);$('#shot').onclick=()=>{renderer.render(scene,camera);const a=document.createElement('a');a.download='bmw-aluminum-v13.png';a.href=renderer.domElement.toDataURL();a.click()};addEventListener('resize',()=>{orthoCamera.left=-extent*innerWidth/innerHeight;orthoCamera.right=extent*innerWidth/innerHeight;orthoCamera.updateProjectionMatrix();perspectiveCamera.aspect=innerWidth/innerHeight;perspectiveCamera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.querySelector('#perspective').onchange=e=>{const next=e.target.checked?perspectiveCamera:orthoCamera;next.position.copy(camera.position);next.quaternion.copy(camera.quaternion);next.up.copy(camera.up);next.zoom=1;camera=next;camera.updateProjectionMatrix();controls.object=camera;controls.update()};const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);if(hoodRoot)hoodRoot.rotation.z=THREE.MathUtils.lerp(hoodRoot.rotation.z,opening,.12);steeringPivots.forEach(o=>o.rotation.y=THREE.MathUtils.lerp(o.rotation.y,steering,.15));if(spinning)wheelPivots.forEach(o=>o.rotation.z=(o.rotation.z-dt*rpm*Math.PI/30)%(2*Math.PI));controls.update();renderer.render(scene,camera)});
